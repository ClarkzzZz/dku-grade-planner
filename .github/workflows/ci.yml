name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/test.sh
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Test Chinese locale defaults
        shell: bash
        run: |
          separator=':'
          if [[ "$RUNNER_OS" == 'Windows' ]]; then separator=';'; fi
          java -Djava.awt.headless=true -Duser.language=zh -Duser.country=CN -cp "build/classes${separator}build/test-classes" edu.dku.gradeplanner.GradePlannerTest
      - name: Verify JAR version and contents
        shell: bash
        run: |
          mkdir -p build/inspect
          cd build/inspect
          jar --extract --file ../dku-grade-planner.jar META-INF/MANIFEST.MF
          version="$(tr -d '\r\n' < ../../VERSION)"
          tr -d '\r' < META-INF/MANIFEST.MF | grep -Fx "Implementation-Version: $version"
          jar --list --file ../dku-grade-planner.jar > contents.txt
          grep -Fx 'edu/dku/gradeplanner/App.class' contents.txt
          if grep -E 'GradePlannerTest|DemoData|\.xml$' contents.txt; then
            echo 'Unexpected test or demo content in application JAR'
            exit 1
          fi
